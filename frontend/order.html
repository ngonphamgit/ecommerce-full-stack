<!DOCTYPE html>
<html>
    <head>
        <title>Cart</title>
        <link rel="stylesheet" href="css/order.css">
        <link rel="stylesheet" href="css/header.css">
    </head>
    <body>
        <div id="header"></div>
        <div id="order-container">
            <h2 id="order-number">Order 0</h2>

            <template id="order-item-card-template">
                <div class="order-item-card">
                    <img class="order-item-img" src="https://picsum.photos/175" alt="Order Item Image">
                    <div class="order-item-middle">
                        <p class="order-item-name">Lorem Ipsum</p>
                        <p class="order-item-desc">Lorem ipsum</p>
                    </div>
                    <div class="order-item-right">
                        <p class="order-item-price">$0.00</p>
                        <p class="order-item-quantity">Quantity: 0</p>
                    </div>
                </div>
            </template>
            <div id="order-items-container">
                
            </div>
        </div>

        <script src="js/orderPage.js"></script>
        <script src="js/header.js"></script>
        <script>
            window.addEventListener("DOMContentLoaded", async () => {
                const jwt = localStorage.getItem("jwt");

                const params = new URLSearchParams(window.location.search);
                orderId = params.get("id") || "";

                loadUserOrder(jwt, orderId);
            })
        </script>
    </body>
</html>
