<!DOCTYPE html>
<html>
    <head>
        <title>Cart</title>
        <link rel="stylesheet" href="css/order.css">
        <link rel="stylesheet" href="css/header.css">
    </head>
    <body>
        <div id="header"></div>
        <div id="page-container">
            <div id="order-container">
                <h2 id="order-number">Order 0</h2>

                <template id="order-item-card-template">
                    <a class="order-item-link" href="productPage.html">
                        <div class="order-item-card">
                            <img class="order-item-img" src="https://picsum.photos/175" alt="Order Item Image">
                            <div class="order-item-middle">
                                <p class="order-item-name">Lorem Ipsum</p>
                                <p class="order-item-desc">Lorem ipsum</p>
                            </div>
                            <div class="order-item-right">
                                <p class="order-item-price">$0.00</p>
                                <p class="order-item-quantity">Quantity: 0</p>
                            </div>
                        </div>
                    </a>
                </template>
                <div id="order-items-container">
                    
                </div>
            </div>

            <div id="checkout-container">
                <p id="cart-total">Total: $0.00</p>
                <button id="checkout-button">Checkout</button>
            </div>
        </div>

        <script src="js/orderPage.js"></script>
        <script src="js/header.js"></script>
        <script>
            window.addEventListener("DOMContentLoaded", async () => {
                const params = new URLSearchParams(window.location.search);
                orderId = params.get("id") || "";

                loadUserOrder(orderId);
            })
        </script>
    </body>
</html>
